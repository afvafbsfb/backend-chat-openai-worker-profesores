# =============================================================================
# CONFIGURACIÓN DE PRODUCCIÓN - AWS ELASTIC BEANSTALK
# =============================================================================

# Puerto del servidor (Elastic Beanstalk usa puerto 5000 por defecto)
server.port=5000

# Confiar en headers de proxy (necesario para HTTPS con Load Balancer)
server.forward-headers-strategy=native

# =============================================================================
# SEGURIDAD Y CORS
# =============================================================================

# CORS: Permitir solo tu dominio de Android/Frontend
# Cambiar por tu dominio real cuando lo tengas
cors.allowed-origins=${ALLOWED_ORIGINS:https://tu-dominio.com}

# =============================================================================
# ACTUATOR (Health checks para AWS)
# =============================================================================

# Endpoints expuestos (solo health e info para AWS Load Balancer)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Health check personalizado
management.health.diskspace.enabled=true
management.health.ping.enabled=true

# Base path para actuator
management.endpoints.web.base-path=/actuator

# =============================================================================
# LOGGING
# =============================================================================

# Nivel de logs en producción (menos verbose)
logging.level.root=INFO
logging.level.com.backendworkersprofesores=INFO
logging.level.org.springframework.web=WARN

# Formato de logs para CloudWatch
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =============================================================================
# CONEXIÓN A API WORKERS (Cloudflare)
# =============================================================================

# URL de tu API Workers en producción
api.workers.base-url=${API_WORKERS_URL:https://tu-worker.workers.dev}

# Timeout de conexión (en milisegundos)
api.workers.connect-timeout=5000
api.workers.read-timeout=30000

# =============================================================================
# OPENAI API
# =============================================================================

# API Key de OpenAI (NUNCA hardcodear, usar variable de entorno)
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4-turbo-preview}
openai.max-tokens=${OPENAI_MAX_TOKENS:4000}

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD
# =============================================================================

# Secret para validar JWT (debe coincidir con API Workers)
jwt.secret=${JWT_SECRET_KEY}

# Validación de JWT habilitada
jwt.validation.enabled=true

# =============================================================================
# CONFIGURACIÓN DE RENDIMIENTO
# =============================================================================

# Thread pool para requests HTTP
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Compresión HTTP
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# =============================================================================
# NOTA IMPORTANTE
# =============================================================================
# Las siguientes variables DEBEN configurarse como variables de entorno en AWS:
# - ALLOWED_ORIGINS: https://tu-app-android.com
# - API_WORKERS_URL: https://tu-worker.workers.dev
# - OPENAI_API_KEY: sk-...
# - JWT_SECRET_KEY: tu_secret_compartido_con_api_workers
