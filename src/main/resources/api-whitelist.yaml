# Whitelist reducida generada a partir de api-workers-profesores
# Incluye endpoints de 'academias', 'usuarios' y autenticación básica (login/refresh/logout)
endpoints:
  - name: crearAcademia
    method: POST
    path: /academias
    description: Crea una nueva academia
    pathParams: []
    query: []
    body:
      - nombre

  - name: listAcademias
    method: GET
    path: /academias
    description: Lista todas las academias (requiere Admin_plataforma)
    pathParams: []
    query: []
    body: []

  - name: getAcademiaById
    method: GET
    path: /academias/{academia_id}
    description: Obtiene los datos de una academia por su ID
    pathParams:
      - academia_id
    query: []
    body: []

  - name: updateAcademia
    method: PATCH
    path: /academias/{academia_id}
    description: Modifica una academia (nombre)
    pathParams:
      - academia_id
    query: []
    body:
      - nombre

  - name: listUsuarios
    method: GET
    path: /usuarios
    description: Lista usuarios (paginación/filtrado puede implementarse en el mediador)
    pathParams: []
    query: []
    body: []

  - name: createUsuario
    method: POST
    path: /usuarios
    description: Crea un nuevo usuario
    pathParams: []
    query: []
    body:
      - nombre
      - email
      - password
      - rol_id
      - academia_id

  - name: getUsuarioById
    method: GET
    path: /usuarios/{usuario_id}
    description: Obtiene los datos de un usuario por id
    pathParams:
      - usuario_id
    query: []
    body: []

  - name: updateUsuario
    method: PUT
    path: /usuarios/{usuario_id}
    description: Actualiza un usuario (PUT)
    pathParams:
      - usuario_id
    query: []
    body:
      - nombre
      - email
      - rol_id
      - academia_id

  - name: deleteUsuario
    method: DELETE
    path: /usuarios/{usuario_id}
    description: Elimina un usuario por id
    pathParams:
      - usuario_id
    query: []
    body: []

  - name: updateCredencialesUsuario
    method: PUT
    path: /usuarios/{usuario_id}/credentials
    description: Actualiza credenciales (password)
    pathParams:
      - usuario_id
    query: []
    body:
      - password

  - name: updateRolUsuario
    method: PUT
    path: /usuarios/{usuario_id}/role
    description: Actualiza rol de usuario
    pathParams:
      - usuario_id
    query: []
    body:
      - rol_id

  - name: updateEstadoUsuario
    method: PUT
    path: /usuarios/{usuario_id}/status
    description: Actualiza el estado del usuario
    pathParams:
      - usuario_id
    query: []
    body:
      - estado

  - name: recoverCredentials
    method: GET
    path: /usuarios/recover
    description: Recuperar credenciales por email (query param 'email')
    pathParams: []
    query:
      - email
    body: []

  - name: getMiPerfil
    method: GET
    path: /usuarios/me
    description: Obtener perfil del usuario autenticado
    pathParams: []
    query: []
    body: []

  - name: login
    method: POST
    path: /auth/login
    description: Login y obtención de tokens
    pathParams: []
    query: []
    body:
      - email
      - password

  - name: refresh
    method: POST
    path: /auth/refresh
    description: Refresh de tokens
    pathParams: []
    query: []
    body:
      - refresh_token

  - name: logout
    method: POST
    path: /auth/logout
    description: Logout (invalidación de refresh token)
    pathParams: []
    query: []
    body:
      - refresh_token
    body: []
